[project]
name = "mplads-sentinel-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.10",
    "pandas==2.2.3",
    "pandera==0.20.4",
    "pyshp==2.3.1",
    "scikit-learn==1.5.2",
    "lifelines==0.29.0",
    "shapely==2.0.6",
    "pyarrow==21.0.0",
    "google-genai==1.20.0",
    "PyJWT==2.9.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]